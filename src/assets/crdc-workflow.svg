<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Research synthesis workflow</title><desc id="desc">A generic, public-safe workflow from a scoped question through lead-agent orchestration, task-specific retrieval, document and chunk reranking, and provenance-linked synthesis. No private partner documents or unpublished results are shown.</desc>
