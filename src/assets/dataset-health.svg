<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Dataset Health Analyzer architecture</title><desc id="desc">Architecture schematic. A browser signs in with Cognito and calls API Gateway and Lambda. CSV files upload directly to S3. The job API queues work in SQS. ECS Fargate workers read CSV objects, analyze queued jobs, write job state to DynamoDB, and are observed through CloudWatch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#31584B"/></marker>
<style>.paper{fill:#F5F2EB}.box{fill:#FFFDF8;stroke:#C9CEC5;stroke-width:1.5}.panel{fill:#E7ECE4;stroke:#AAB8AC;stroke-width:1.5}.label{font:600 22px Arial,sans-serif;fill:#202622}.small{font:20px Arial,sans-serif;fill:#59645C}.kicker{font:20px Arial,sans-serif;fill:#31584B;letter-spacing:1.3px}.title{font:32px Georgia,serif;fill:#202622}.flow{fill:none;stroke:#31584B;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 5}.rule{stroke:#C9CEC5;stroke-width:1}.mono{font:20px Consolas,monospace;fill:#31584B}</style></defs>
<rect width="900" height="560" class="paper"/>
<path d="M20 32V20H32M868 20H880V32M20 528V540H32M868 540H880V528" fill="none" stroke="#AAB8AC"/>
<text x="44" y="43" class="kicker">02 / CLOUD SYSTEM</text><text x="44" y="84" class="title">From CSV upload to queued analysis</text><text x="44" y="115" class="small">Dataset Health Analyzer · queued CSV analysis</text>
<path d="M224 193H300" class="flow"/><path d="M530 193H620" class="flow"/><path d="M134 238V330" class="flow"/><path d="M415 238V330" class="flow"/><path d="M530 375H620" class="flow"/><path d="M738 330V238" class="flow"/><text x="154" y="289" class="small">Direct upload</text><rect x="44" y="148" width="180" height="90" rx="4" class="box"/><text x="64" y="182" class="label">Browser app</text><text x="64" y="212" class="small">Cognito / JWT</text><rect x="300" y="148" width="230" height="90" rx="4" class="box"/><text x="320" y="182" class="label">API Gateway</text><text x="320" y="212" class="small">Lambda · job API</text><rect x="620" y="148" width="236" height="90" rx="4" class="box"/><text x="640" y="182" class="label">DynamoDB</text><text x="640" y="212" class="small">Job state</text><rect x="44" y="330" width="180" height="90" rx="4" class="panel"/><text x="64" y="364" class="label">S3</text><text x="64" y="394" class="small">CSV objects</text><rect x="300" y="330" width="230" height="90" rx="4" class="panel"/><text x="320" y="364" class="label">SQS</text><text x="320" y="394" class="small">Queued jobs</text><rect x="620" y="330" width="236" height="90" rx="4" class="panel"/><text x="640" y="364" class="label">Fargate workers</text><text x="640" y="394" class="small">Analysis modules</text><path d="M134 420V440H738V420" class="flow dashed"/><rect x="44" y="461" width="812" height="40" fill="#E7ECE4"/><text x="64" y="488" class="label">CloudWatch</text><text x="260" y="488" class="small">Logs, queue depth &amp; worker scaling</text>
