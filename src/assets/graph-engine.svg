<text x="44" y="43" class="kicker">06 / DATA STRUCTURES</text><text x="44" y="84" class="title">Exploration becomes a route plan</text><text x="44" y="115" class="small">Graph optimisation engine · data-oriented implementation</text>
<rect x="44" y="155" width="280" height="305" rx="4" class="panel"/><text x="64" y="191" class="label">Unknown graph</text><g fill="none" stroke="#91A491" stroke-width="2"><path d="M100 272L178 240L254 297L178 353L100 272L108 403L178 353M254 297L252 414L178 353"/></g><circle cx="100" cy="272" r="10" fill="#A85F40"/><circle cx="178" cy="240" r="10" fill="#31584B"/><circle cx="254" cy="297" r="10" fill="#31584B"/><circle cx="178" cy="353" r="10" fill="#31584B"/><circle cx="108" cy="403" r="10" fill="#31584B"/><circle cx="252" cy="414" r="10" fill="#31584B"/><path d="M324 265H356V210H390" class="flow"/><rect x="390" y="155" width="466" height="110" rx="4" class="panel"/><text x="410" y="189" class="label">Flat-array representation</text><text x="410" y="219" class="small">Nodes, edges, weights and next links</text><path d="M500 265V350" class="flow"/><path d="M636 398H610" class="flow"/><rect x="390" y="350" width="220" height="110" rx="4" class="box"/><text x="410" y="384" class="label">Search routines</text><text x="410" y="414" class="small">BFS · Dijkstra</text><rect x="636" y="350" width="220" height="110" rx="4" class="box"/><text x="656" y="384" class="label">Data structures</text><text x="656" y="414" class="small">Heap · hash table</text><text x="44" y="494" class="small">Discover exits → plan a route → queue actions</text>
