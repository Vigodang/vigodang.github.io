<svg role="img" aria-labelledby="chart-title chart-description" xmlns:xlink="http://www.w3.org/1999/xlink" width="900pt" height="600pt" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" version="1.1">
<title id="chart-title">Parallel protein signature generation: qut3 benchmark</title>
<desc id="chart-description">Mean internal application runtimes from ten archived measurements per configuration: optimised sequential 0.588 seconds; OpenMP at one, two, four and eight requested threads 0.576, 0.349, 0.233 and 0.181 seconds. Whiskers show archived 95 percent runtime confidence intervals. The eight-thread result is 3.25 times faster than the optimised sequential baseline. AMD Ryzen 7 7800X3D, WSL2, GCC 15.2.0. Affinity and frequency were not controlled. No new benchmark was run.</desc>

 <title>Parallel protein signature generation — verified qut3 benchmark</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Parallel protein signature generation — verified qut3 benchmark</dc:title>
    <dc:description>Mean internal application runtimes from the archived final-validation session. Ten runs per configuration, with archived 95 percent confidence intervals. Optimised sequential 0.588282 s; OpenMP 1 thread 0.575697 s, 2 threads 0.348762 s, 4 threads 0.233363 s, 8 threads 0.180746 s. Eight-thread speedup against the optimised sequential baseline is 3.25 times. AMD Ryzen 7 7800X3D, WSL2, GCC 15.2.0. CPU affinity and frequency were not controlled. No new benchmark was run.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Vigo Dang portfolio — chart rebuilt from verified archived measurements</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
