<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Predictive risk application data flow</title>
  <desc id="desc">PyQt6 UI, service layer, machine learning pipeline, model registry, prediction result and report flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#45d6ff"/>
    </marker>
    <style>
      .bg{fill:#06101d}.box{fill:#0d1d2f;stroke:#29425f;stroke-width:2}.group{fill:#12243a;stroke:#315174;stroke-width:2}.warn{fill:#17243a;stroke:#45d6ff;stroke-width:2}.title{font:700 23px Arial,sans-serif;fill:#eaf2fb}.label{font:700 16px Arial,sans-serif;fill:#eaf2fb}.small{font:13px Arial,sans-serif;fill:#b9c8d6}.line{fill:none;stroke:#45d6ff;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1080" height="620"/>
  <text x="48" y="54" class="title">Full-stack predictive risk application</text>
  <text x="48" y="82" class="small">Training, prediction and reporting workflow based on repository evidence.</text>

  <rect x="64" y="130" width="230" height="92" rx="10" class="box"/>
  <text x="88" y="164" class="label">PyQt6 interface</text>
  <text x="88" y="190" class="small">Login, prediction, dashboard, reports</text>

  <rect x="420" y="130" width="240" height="92" rx="10" class="group"/>
  <text x="444" y="164" class="label">Service layer</text>
  <text x="444" y="190" class="small">Auth, ML, data quality, model management</text>

  <rect x="786" y="130" width="230" height="92" rx="10" class="box"/>
  <text x="810" y="164" class="label">MySQL-oriented data</text>
  <text x="810" y="190" class="small">Users, customers, prediction logs</text>

  <rect x="110" y="336" width="230" height="92" rx="10" class="box"/>
  <text x="134" y="370" class="label">Training workflow</text>
  <text x="134" y="396" class="small">30,000 rows, 41-feature schema</text>

  <rect x="426" y="336" width="230" height="92" rx="10" class="box"/>
  <text x="450" y="370" class="label">Models</text>
  <text x="450" y="396" class="small">XGBoost, LightGBM, calibrated LR</text>

  <rect x="742" y="336" width="230" height="92" rx="10" class="box"/>
  <text x="766" y="370" class="label">Prediction result</text>
  <text x="766" y="396" class="small">Probability, risk label, model context</text>

  <rect x="285" y="490" width="510" height="68" rx="10" class="warn"/>
  <text x="310" y="522" class="label">Public link gated by cleanup</text>
  <text x="310" y="546" class="small">Generated logs and sensitive outputs must be removed before linking this repo.</text>

  <path class="line" d="M294 176h116"/>
  <path class="line" d="M660 176h116"/>
  <path class="line" d="M540 222v102"/>
  <path class="line" d="M340 382h76"/>
  <path class="line" d="M656 382h76"/>
  <path class="line" d="M857 428v50"/>
</svg>
