<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Predictive Credit Scoring System application structure</title><desc id="desc">A Python and PyQt6 interface calls application services, which invoke a model preprocessing and inference pipeline. Prediction history is stored in MySQL and used for reporting. The schematic does not imply production or bank-grade validation.</desc>
